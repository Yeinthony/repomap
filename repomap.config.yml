# Self-test: treat each repomap package as a "service"
repos:
  - path: ./packages/core
    name: core
    description: Parser, graph builder, orchestrator and LLM-facing types
  - path: ./packages/cli
    name: cli
    description: User-facing CLI (repomap generate/watch/serve/init)
  - path: ./packages/adapters/claude
    name: adapter-claude
    description: AI adapter that calls the Anthropic API directly
  - path: ./packages/adapters/claude-code
    name: adapter-claude-code
    description: AI adapter that uses the local Claude Code CLI

output:
  path: ./repomap-docs
  format: html

ai:
  provider: claude-code
  model: sonnet
  maxBudgetUsd: 2.00

watch: false
language: es
