name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Verify CLI binary
        run: node packages/cli/dist/index.js --version

      - name: Pack each workspace (dry-run)
        run: npm run pack:dry
